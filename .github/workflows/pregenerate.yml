name: Pregenerate Cards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: pregenerate-cards
  cancel-in-progress: false
jobs:
  pregenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_STATS_BASE_URL: ${{ vars.GH_STATS_BASE_URL }}
      GH_STATS_USERNAME: ${{ vars.GH_STATS_USERNAME }}
      GH_REPOSITORY_NAME: ${{ vars.GH_REPOSITORY_NAME }}
      GIST_ID: ${{ vars.GIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate and validate all cards
        if: env.GH_STATS_BASE_URL != '' && env.GH_STATS_USERNAME != ''
        run: node scripts/pregenerate.mjs
      - name: Publish changed cards
        if: env.GH_STATS_BASE_URL != '' && env.GH_STATS_USERNAME != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: pregenerate cards"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((attempt * 10))
            git fetch origin main
            git rebase origin/main
          done
          exit 1
