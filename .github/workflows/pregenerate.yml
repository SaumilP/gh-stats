name: Pregenerate Cards

# on:
#   workflow_dispatch:
#   schedule:
#     # Weekly: Sundays 06:00 GMT+2 == 04:00 UTC
#     - cron: "0 4 * * 0"

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  pregenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Debug required env (no values)
        shell: bash
        run: |
          test -n "${GH_STATS_BASE_URL:-}" && echo "GH_STATS_BASE_URL set" || echo "GH_STATS_BASE_URL missing 🫨"
          test -n "${GH_STATS_USERNAME:-}" && echo "GH_STATS_USERNAME set" || echo "GH_STATS_USERNAME missing 🫨"
      - name: Generate SVG cards
        env:
          GH_STATS_BASE_URL: ${{ secrets.GH_STATS_BASE_URL }}
          GH_STATS_USERNAME: ${{ secrets.GH_STATS_USERNAME }}
        run: node scripts/pregenerate.mjs
      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards
          git commit -m "chore: pregenerate cards"
          git push
